# Coverage is followed, not enforced: statuses inform, they never block.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  web:
    paths: [src/]
    carryforward: true
  server:
    paths: [server/]
    carryforward: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
