name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC: no token to store.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: web
          fail_ci_if_error: false

  server:
    name: Server tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # As on the server (Ubuntu 24.04).
      # Coverage is only measured here: the service itself stays stdlib-only.
      - run: pip install coverage
      - run: python -m coverage run --source=server --omit='server/test_*' -m unittest discover -s server -q
      - run: python -m coverage report && python -m coverage xml -o coverage/server.xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/server.xml
          flags: server
          fail_ci_if_error: false

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Also measures what the pages ran, mapped back to src/ (e2e/coverage.ts).
      - run: pnpm e2e:coverage
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/e2e/lcov.info
          flags: e2e
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
