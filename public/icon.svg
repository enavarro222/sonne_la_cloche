<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#3a2d9a"/>
      <stop offset="0.7" stop-color="#1b1464"/>
    </radialGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#e79d12"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Fairground stripes, as in the game's background -->
    <g fill="#ffffff" opacity="0.045" transform="rotate(25 256 256)">
      <rect x="-200" y="-200" width="60" height="1000"/>
      <rect x="-60" y="-200" width="60" height="1000"/>
      <rect x="80" y="-200" width="60" height="1000"/>
      <rect x="220" y="-200" width="60" height="1000"/>
      <rect x="360" y="-200" width="60" height="1000"/>
      <rect x="500" y="-200" width="60" height="1000"/>
      <rect x="640" y="-200" width="60" height="1000"/>
    </g>
  </g>
  <!-- "Ding" -->
  <g fill="none" stroke="#2ee6a8" stroke-width="18" stroke-linecap="round">
    <path d="M 96 190 Q 70 236 88 290"/>
    <path d="M 58 160 Q 20 236 50 318" opacity="0.6"/>
    <path d="M 416 190 Q 442 236 424 290"/>
    <path d="M 454 160 Q 492 236 462 318" opacity="0.6"/>
  </g>
  <!-- The bell, swinging a little -->
  <g transform="rotate(-14 256 250)">
    <circle cx="256" cy="112" r="26" fill="#e79d12"/>
    <circle cx="256" cy="404" r="34" fill="#ff3b77"/>
    <path d="M 256 128 C 178 128 142 190 142 262 L 142 318 C 142 344 120 362 100 376 L 412 376 C 392 362 370 344 370 318 L 370 262 C 370 190 334 128 256 128 Z" fill="url(#bell)"/>
    <rect x="88" y="366" width="336" height="36" rx="18" fill="#e79d12"/>
    <path d="M 196 176 C 176 204 170 244 172 300" fill="none" stroke="#fff6d8" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
